name: Notify Google Chat on Docker Branch Push

on:
  push:
    branches: [ "docker" ]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get list of changed files safely
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED="Initial commit - all files"
          fi
          echo "CHANGED_FILES=$CHANGED" >> $GITHUB_ENV

      - name: Get commit details
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          EMAIL=$(git log -1 --pretty=format:'%ae')
          REPO=${GITHUB_REPOSITORY}
          BRANCH=${GITHUB_REF##*/}
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          TIME=$(date +"%Y-%m-%d %H:%M:%S")

          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "EMAIL=$EMAIL" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "TIME=$TIME" >> $GITHUB_ENV

      - name: Send Google Chat Notification
        run: |
          WEBHOOK_URL="https://chat.googleapis.com/v1/spaces/AAQAlYSxQ48/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=COURGwB1cADoPIs8ntkUCO7-laFiICdTClvDxf1gdlw"
          FILE_LIST=$(echo "$CHANGED_FILES" | sed 's/^/- /')

          # Build JSON payload
          JSON_PAYLOAD=$(cat <<EOF
{
  "cards": [
    {
      "header": {
        "title": "🚀 Docker Branch Push Notification",
        "subtitle": "Optculture Automation"
      },
      "sections": [
        {
          "header": "📦 Files Changed",
          "widgets": [
            {
              "textParagraph": {
                "text": "$(echo "$FILE_LIST" | sed ':a;N;$!ba;s/\n/<br>/g')"
              }
            }
          ]
        },
        {
          "header": "📝 Commit Details",
          "widgets": [
            {
              "textParagraph": {
                "text": "<b>Repository:</b> $REPO<br><b>Branch:</b> $BRANCH<br><b>Author:</b> $AUTHOR (<$EMAIL>)<br><b>Message:</b> $COMMIT_MSG<br><b>Time:</b> $TIME"
              }
            }
          ]
        },
        {
          "widgets": [
            {
              "textParagraph": {
                "text": "<i>Regards,<br>Optculture Automation</i>"
              }
            }
          ]
        }
      ]
    }
  ]
}
EOF
)

          # Send to Google Chat
          curl -X POST -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$WEBHOOK_URL"

      - name: Notification Sent
        run: echo "Google Chat notification sent successfully!"
