name: Notify Google Chat on Docker Branch Push

on:
  push:
    branches:
      - docker

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: Send Google Chat Notification
        run: |
          # Get changed files
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD~1 HEAD | sed 's/^/- /' | head -20 | tr '\n' ' ')
          else
            FILES="Initial commit"
          fi
          
          # Get commit details
          AUTHOR=$(git log -1 --pretty=format:'%an')
          EMAIL=$(git log -1 --pretty=format:'%ae')
          MSG=$(git log -1 --pretty=format:'%s')
          SHA=${GITHUB_SHA:0:7}
          TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          REPO=$GITHUB_REPOSITORY
          BRANCH=${GITHUB_REF#refs/heads/}
          
          # Escape double quotes in variables
          FILES=$(echo "$FILES" | sed 's/"/\\"/g')
          AUTHOR=$(echo "$AUTHOR" | sed 's/"/\\"/g')
          MSG=$(echo "$MSG" | sed 's/"/\\"/g')
          
          # Create JSON payload
          JSON='{
            "cards": [{
              "header": {
                "title": "🚀 Docker Branch Push",
                "subtitle": "Optculture Automation"
              },
              "sections": [
                {
                  "header": "📦 Files Changed",
                  "widgets": [{
                    "textParagraph": {
                      "text": "'"$FILES"'"
                    }
                  }]
                },
                {
                  "header": "📝 Commit Details",
                  "widgets": [{
                    "textParagraph": {
                      "text": "<b>Repository:</b> '"$REPO"'<br><b>Branch:</b> '"$BRANCH"'<br><b>Commit:</b> '"$SHA"'<br><b>Author:</b> '"$AUTHOR"' ('"$EMAIL"')<br><b>Message:</b> '"$MSG"'<br><b>Time:</b> '"$TIME"'"
                    }
                  }]
                },
                {
                  "widgets": [{
                    "textParagraph": {
                      "text": "<i>Regards,<br>Optculture Automation</i>"
                    }
                  }]
                }
              ]
            }]
          }'
          
          # Send to Google Chat
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "https://chat.googleapis.com/v1/spaces/AAQAlYSxQ48/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=COURGwB1cADoPIs8ntkUCO7-laFiICdTClvDxf1gdlw"
          
          echo "✅ Notification sent!"
