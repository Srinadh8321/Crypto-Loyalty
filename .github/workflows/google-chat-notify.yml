name: Notify Google Chat on Docker Branch Push

on:
  push:
    branches: [ "docker" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: Get commit and file details
        id: details
        run: |
          # Get changed files
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD~1 HEAD | sed 's/^/- /' | paste -sd '|' -)
          else
            FILES="- Initial commit"
          fi
          
          # Get commit info
          AUTHOR=$(git log -1 --pretty=format:'%an')
          EMAIL=$(git log -1 --pretty=format:'%ae')
          MESSAGE=$(git log -1 --pretty=format:'%s')
          SHA=${GITHUB_SHA:0:7}
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Output to GitHub environment with multiline support
          {
            echo "FILES<<EOF"
            echo "$FILES"
            echo "EOF"
            echo "AUTHOR=$AUTHOR"
            echo "EMAIL=$EMAIL"
            echo "MESSAGE=$MESSAGE"
            echo "SHA=$SHA"
            echo "TIMESTAMP=$TIMESTAMP"
            echo "REPO=$GITHUB_REPOSITORY"
            echo "BRANCH=${GITHUB_REF#refs/heads/}"
          } >> $GITHUB_ENV
      
      - name: Send to Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          # Convert files list
          FILES_HTML=$(echo "$FILES" | tr '|' '\n' | sed 's/$/\\n/' | tr -d '\n')
          
          # Escape special characters for JSON
          MESSAGE_ESC=$(echo "$MESSAGE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          AUTHOR_ESC=$(echo "$AUTHOR" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          
          # Build and send JSON
          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "cards": [{
                "header": {
                  "title": "🚀 Docker Branch Push",
                  "subtitle": "Optculture Automation"
                },
                "sections": [
                  {
                    "header": "📦 Files Changed",
                    "widgets": [{
                      "textParagraph": {
                        "text": "'"$FILES_HTML"'"
                      }
                    }]
                  },
                  {
                    "header": "📝 Commit Details",
                    "widgets": [{
                      "textParagraph": {
                        "text": "<b>Repository:</b> '"$REPO"'<br><b>Branch:</b> '"$BRANCH"'<br><b>Commit:</b> '"$SHA"'<br><b>Author:</b> '"$AUTHOR_ESC"' ('"$EMAIL"')<br><b>Message:</b> '"$MESSAGE_ESC"'<br><b>Time:</b> '"$TIMESTAMP"'"
                      }
                    }]
                  },
                  {
                    "widgets": [{
                      "textParagraph": {
                        "text": "<i>Regards,<br>Optculture Automation</i>"
                      }
                    }]
                  }
                ]
              }]
            }'
          
          echo "✅ Notification sent successfully"
